name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - ah-douyin-clean-downloader
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python 版本和 Codex 环境
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 只提供可以公开的最小复现，不要提交真实视频、Cookie、Token、账号或私密链接
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已经删除日志中的 Cookie、Token、账号、私密链接和真实用户数据
          required: true

